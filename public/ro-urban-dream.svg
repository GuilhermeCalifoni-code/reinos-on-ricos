<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Cidade onírica de Reinos Oníricos</title>
<desc id="desc">Paisagem de fantasia urbana com torres, pontes, lua e geometria onírica em tinta escura e cobre.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8f4ec"/>
    <stop offset=".62" stop-color="#f0ece4"/>
    <stop offset="1" stop-color="#e8e1d6"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17202a"/>
    <stop offset="1" stop-color="#0d1217"/>
  </linearGradient>
  <radialGradient id="moon">
    <stop offset="0" stop-color="#d4a35d" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#b7792f" stop-opacity=".38"/>
    <stop offset="1" stop-color="#b7792f" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="8" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
  </filter>
</defs>
